name: Release

# Pushing a tag like v0.0.18 builds the plugin and attaches the jar to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shaded jar
        run: cd blockships && gradle shadowJar --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: blockships/build/libs/BlockShips-*.jar
          generate_release_notes: true
